
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Tonmoy Datta | MERN Stack Developer</title>
  </head>

  <body
    class="w-full h-screen font-display bg-background text-text overflow-x-hidden overflow-y-auto snap-y snap-mandatory scroll-smooth"
  >
    <!-- 1st section - navbar and hero section -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start bg-surface flex flex-col"
      id="home"
    >
      <!-- Navbar -->
      <nav
        class="w-full max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 px-4 sm:px-6 lg:px-10 py-5"
      >
        <a href="#home" class="text-xl font-bold whitespace-nowrap">
          <i class="fa-solid fa-briefcase" aria-hidden="true"></i>
          Tonmoy Datta
        </a>

        <div
          class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm sm:text-base"
        >
          <a href="#home" class="hover:text-accent">Home</a>
          <a href="#about" class="hover:text-accent">About</a>
          <a href="#skills" class="hover:text-accent">Skills</a>
          <a href="#projects" class="hover:text-accent">Projects</a>
          <a href="#contact" class="hover:text-accent">Contact</a>
        </div>
      </nav>

      <!-- Hero content -->
      <div
        class="w-full max-w-6xl mx-auto flex flex-col-reverse md:flex-row items-center justify-center md:justify-between gap-8 md:gap-10 px-5 sm:px-8 lg:px-10 py-8 md:py-12 flex-1"
      >
        <!-- Left side - text content -->
        <div
          class="w-full md:w-1/2 flex flex-col items-center md:items-start gap-5 text-center md:text-left"
        >
          <div class="flex flex-col gap-2">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold">
              Tonmoy Datta
            </h1>

            <p class="text-lg sm:text-xl">
              MERN Stack Developer
            </p>
          </div>

          <p class="max-w-xl text-sm sm:text-base text-muted leading-relaxed">
            Passionate about creating beautiful and functional web applications.
            My goal is to build user-friendly and efficient web solutions that
            make a positive impact on people's lives.
          </p>

          <!-- Buttons -->
          <div
            class="flex flex-wrap justify-center md:justify-start gap-3"
          >
            <a
              href="#projects"
              class="inline-flex items-center justify-center bg-accent text-background px-4 py-2.5 rounded-2xl hover:bg-accent/80 transition-colors"
            >
              View Projects
            </a>

            <a
              href="#contact"
              class="inline-flex items-center justify-center bg-transparent text-accent border border-accent px-4 py-2.5 rounded-2xl hover:bg-accent/80 hover:text-background transition-colors"
            >
              Contact Me
            </a>
          </div>
        </div>

        <!-- Right side - profile image -->
        <div
          class="w-full md:w-1/2 flex justify-center md:justify-end"
        >
          <!-- Relative wrapper for the desktop image overlap -->
          <div
            class="relative w-52 h-60 sm:w-60 sm:h-72 md:w-56 md:h-72 lg:w-64 lg:h-80 rounded-3xl bg-[#c5c1b6] shrink-0"
          >
            <img
              src="./assets/profile.jpg"
              alt="Portrait of Tonmoy Datta"
              class="w-full h-full rounded-3xl object-cover lg:absolute lg:w-64 lg:h-80 lg:right-20 lg:bottom-0"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- 2nd section - about me -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="about"
    ></section>

    <!-- 3rd section - skills -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="skills"
    ></section>

    <!-- 4th section - projects -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="projects"
    ></section>

    <!-- 5th section - education -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="education"
    ></section>

    <!-- 6th section - contact -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="contact"
    ></section>

    <!-- 7th section - footer -->
    <section
      class="w-full min-h-screen min-h-[100svh] snap-start"
      id="footer"
    ></section>

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/fb6788d0b7.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
